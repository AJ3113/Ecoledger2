<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#B0D68C">
<title>Collector sign in - EcoLedger</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="auth">
  <div class="auth-card">
    <div class="auth-icon" data-icon="truck" data-size="26"></div>
    <h1>Collector sign in</h1>
    <p class="lead">Use the collector ID and password you were given.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="id">Collector ID</label>
        <input id="id" name="id" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="COL-01" aria-describedby="id-error" required>
        <div class="error" id="id-error" role="alert"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error" required>
          <button type="button" class="pw-toggle" data-pw-toggle="password" aria-pressed="false">Show</button>
        </div>
        <div class="error" id="password-error" role="alert"></div>
      </div>
      <div class="alert error" id="form-error" role="alert" hidden></div>
      <button class="btn" id="submit" type="submit">Sign in</button>
    </form>
    <div class="auth-links">
      <span class="muted">Not a collector? <a href="/login">Citizen sign in</a> &middot; <a href="/admin/login">Admin sign in</a></span>
      <a href="/">&larr; Back to home</a>
    </div>
  </div>
</main>
<script src="/common.js"></script>
<script>
mountNav({ back: '/' });
wireLogin({
  role: 'collector', next: '/collector/',
  normalize(v) {
    const id = v.trim().toUpperCase();
    return id ? { value: id } : { error: 'Enter your collector ID, for example COL-01' };
  },
  failMsg: 'That collector ID or password is not right. Please try again.',
});
</script>
</body></html>
