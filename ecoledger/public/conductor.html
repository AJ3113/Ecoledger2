<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#B0D68C">
<title>Conductor - EcoLedger</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="/app.css">
<style>
#card { text-align:center; }
#card img { width:260px; max-width:100%; image-rendering:pixelated; }
@media print { #form-view, #lockbtn, .noprint { display:none !important; } #card { border:0; } }
</style>
</head>
<body>
<main>
  <h1>Conductor ticket</h1>
  <p class="muted noprint">Issue a ticket for a rider. They scan its QR code in the EcoLedger app to earn points on electric buses.</p>

  <section id="keybox" class="card" hidden>
    <h2 style="margin-top:0">Unlock this device</h2>
    <form id="keyform" novalidate>
      <div class="field" style="margin-top:0">
        <label for="key">Device key</label>
        <div class="input-wrap">
          <input id="key" type="password" autocomplete="off" aria-describedby="key-error">
          <button type="button" class="pw-toggle" data-pw-toggle="key" aria-pressed="false">Show</button>
        </div>
        <div class="hint">Your depot gives you this key. It is remembered until you close this tab.</div>
        <div class="error" id="key-error" role="alert"></div>
      </div>
      <button class="btn" id="keybtn" type="submit">Unlock</button>
    </form>
  </section>

  <section id="form-view" hidden>
    <form id="form" class="card" novalidate>
      <div class="field" style="margin-top:0">
        <label for="bus">Bus</label>
        <select id="bus"></select>
        <div class="hint" id="bus-hint">&nbsp;</div>
      </div>
      <div class="field">
        <label for="km">Distance (km)</label>
        <input id="km" type="number" step="0.1" min="0.1" inputmode="decimal" aria-describedby="km-error">
        <div class="error" id="km-error" role="alert"></div>
      </div>
      <div class="field">
        <label for="fare">Fare (Rs)</label>
        <input id="fare" type="number" step="0.5" min="0.5" inputmode="decimal" aria-describedby="fare-error">
        <div class="error" id="fare-error" role="alert"></div>
      </div>
      <div class="alert error" id="err" role="alert" hidden></div>
      <button class="btn" id="gen" type="submit">Generate ticket</button>
    </form>
  </section>

  <section class="card" id="card" hidden aria-live="polite">
    <div class="chip good" style="margin-bottom:8px">Ticket ready</div>
    <h2 id="c-title" style="margin-top:0"></h2>
    <img id="c-qr" alt="Ticket QR code" width="260" height="260">
    <div class="mono muted" id="c-payload"></div>
    <div class="muted" id="c-meta"></div>
    <div class="btn-row noprint">
      <button class="btn ghost" id="printbtn" type="button"><span data-icon="printer" data-size="18"></span> Print</button>
      <button class="btn" id="newbtn" type="button">New ticket</button>
    </div>
  </section>

  <p class="muted noprint" id="count" hidden></p>
  <button class="btn ghost noprint" id="lockbtn" type="button" hidden>Lock this device</button>
</main>
<script src="/common.js"></script>
<script>
mountNav({ title: 'Conductor', links: [{ label: 'Home', href: '/' }] });
const $ = (i) => document.getElementById(i);
const getKey = () => { try { return sessionStorage.getItem('deviceKey') || ''; } catch (e) { return ''; } };
const setKey = (v) => { try { v ? sessionStorage.setItem('deviceKey', v) : sessionStorage.removeItem('deviceKey'); } catch (e) { /* storage blocked */ } };
const call = (path, body) => api(path, { noRedirect: true, headers: { 'x-device-key': getKey() }, ...(body ? { body } : {}) });
let buses = [], issued = 0;

function locked(msg) {
  setKey(''); $('keybox').hidden = false; $('form-view').hidden = true; $('lockbtn').hidden = true; $('card').hidden = true;
  setFieldError('key', msg || '');
}
function busHint() {
  const b = buses.find((x) => x.bus_number === $('bus').value);
  $('bus-hint').textContent = !b ? '' : b.is_ev ? 'Electric bus: riders earn points on this ticket.' : 'Diesel bus: riders earn no points on this ticket.';
}
async function unlock() {
  buses = (await call('/api/conductor/buses')).sort((a, b) => b.is_ev - a.is_ev || a.bus_number.localeCompare(b.bus_number));
  let last = ''; try { last = sessionStorage.getItem('lastBus') || ''; } catch (e) { /* ignore */ }
  $('bus').innerHTML = buses.map((b) => `<option value="${esc(b.bus_number)}" ${b.bus_number === last ? 'selected' : ''}>${esc(b.bus_number)} (${b.is_ev ? 'electric' : 'diesel'})</option>`).join('');
  $('keybox').hidden = true; $('form-view').hidden = false; $('lockbtn').hidden = false; busHint();
}
async function start() {
  if (!getKey()) return locked('');
  try { await unlock(); }
  catch (e) { e.status === 401 ? locked('That key is not right. Check it and try again.') : (($('keybox').hidden = false), setFieldError('key', e.message)); }
}
$('keyform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = $('key').value.trim();
  if (!v) { setFieldError('key', 'Enter the device key.'); $('key').focus(); return; }
  setKey(v); $('key').value = '';
  await withBusy($('keybtn'), start);
});
$('key').addEventListener('input', () => setFieldError('key', ''));
$('bus').addEventListener('change', busHint);
$('lockbtn').onclick = () => { locked(''); $('card').hidden = true; toast('Device locked', 'info'); };
['km', 'fare'].forEach((i) => $(i).addEventListener('input', () => { setFieldError(i, ''); $('err').hidden = true; }));
$('printbtn').onclick = () => window.print();
$('newbtn').onclick = () => { $('card').hidden = true; $('form-view').hidden = false; $('km').value = ''; $('fare').value = ''; $('km').focus(); };

$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); $('err').hidden = true;
  const km = Number($('km').value), fare = Number($('fare').value);
  let bad = false;
  if (!$('km').value || !(km > 0)) { setFieldError('km', 'Enter the distance above 0.'); bad = true; }
  if (!$('fare').value || !(fare > 0)) { setFieldError('fare', 'Enter the fare above 0.'); bad = true; }
  if (bad) { (document.querySelector('.field.invalid input') || {}).focus?.(); return; }
  await withBusy($('gen'), async () => {
    try {
      const r = await call('/api/conductor/tickets', { bus_number: $('bus').value, distance_km: km, fare });
      try { sessionStorage.setItem('lastBus', $('bus').value); } catch (x) { /* ignore */ }
      issued++;
      $('c-title').textContent = `Ticket ${r.ticket.ticket_id}`; $('c-qr').src = r.qr; $('c-payload').textContent = r.payload;
      $('c-meta').textContent = `${r.ticket.bus_number} · ${r.ticket.distance_km} km · Rs ${r.ticket.fare} · ${new Date(r.ticket.issued_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}`;
      $('card').hidden = false; $('form-view').hidden = true;
      $('count').hidden = false; $('count').textContent = `${issued} ticket${issued === 1 ? '' : 's'} issued since you unlocked this device.`;
      $('card').scrollIntoView && $('card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (x) {
      if (x.status === 401) return locked('The key was rejected. Enter it again.');
      $('err').textContent = x.message; $('err').hidden = false;
    }
  });
});
start();
</script>
</body></html>
